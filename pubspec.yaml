name: pathfitfinder
description: "A campus marketplace for secondhand UST PATHFIT uniforms."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.4.0
  image_picker: ^1.2.4
  firebase_data_connect: ^0.4.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
